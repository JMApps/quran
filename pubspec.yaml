name: quran
description: "Quran"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  sqflite: ^2.4.2
  provider: ^6.1.5+1
  path: ^1.9.1
  salomon_bottom_bar: ^3.3.2
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  wakelock_plus: ^1.6.0
  flutter_material_color_picker: ^1.2.0
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.0.0
  pasteboard: ^0.5.0
  arabic_justified_text: ^1.0.2
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/databases/
    - assets/fonts/

  fonts:
    - family: 'Gilroy'
      fonts:
        - asset: assets/fonts/gilroy_regular.ttf
    - family: 'Gilroy Medium'
      fonts:
        - asset: assets/fonts/gilroy_medium.ttf
    - family: 'Uthmanic Hafs'
      fonts:
        - asset: assets/fonts/uthmanic_hafs_v_22.ttf
    - family: 'SP Pro'
      fonts:
        - asset: assets/fonts/sf_pro_regular.ttf
    - family: 'Surah name'
      fonts:
        - asset: assets/fonts/surah_name_v2.ttf
    - family: 'P1'
      fonts:
        - asset: assets/pagefonts/p1.ttf
    - family: 'P2'
      fonts:
        - asset: assets/pagefonts/p2.ttf
    - family: 'P3'
      fonts:
        - asset: assets/pagefonts/p3.ttf
    - family: 'P4'
      fonts:
        - asset: assets/pagefonts/p4.ttf
    - family: 'P5'
      fonts:
        - asset: assets/pagefonts/p5.ttf
    - family: 'P6'
      fonts:
        - asset: assets/pagefonts/p6.ttf
    - family: 'P7'
      fonts:
        - asset: assets/pagefonts/p7.ttf
    - family: 'P8'
      fonts:
        - asset: assets/pagefonts/p8.ttf
    - family: 'P9'
      fonts:
        - asset: assets/pagefonts/p9.ttf
    - family: 'P10'
      fonts:
        - asset: assets/pagefonts/p10.ttf