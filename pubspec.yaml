name: quran
description: "Quran"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  sqflite: ^2.4.2
  provider: ^6.1.5+1
  path: ^1.9.1
