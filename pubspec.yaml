name: quran
description: "Quran"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  provider: ^6.1.5+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/databases/
    - assets/fonts/
    - assets/pictures/
    - assets/icons/
    - assets/qpc_v2_fonts/

  fonts:

    - family: 'Gilroy'
      fonts:
        - asset: assets/fonts/gilroy_regular.ttf
    - family: 'Uthmanic Hafs'
      fonts:
        - asset: assets/fonts/uthmanic_hafs_v_22.ttf
